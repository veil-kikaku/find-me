<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問題作成</title><link rel="stylesheet" href="css/style.css"></head><body><header><h1>🛠️ 問題作成</h1><p>写真を選び、探す対象の中心をクリック</p></header><main><nav><a href="index.html">ゲームへ戻る</a></nav><section class="panel"><h2>1. 既存の問題データ（追加時のみ）</h2><label>現在の data/questions.json を選択 <input type="file" id="existing" accept=".json,application/json"></label><p id="existingStatus" class="small">未選択：新しい問題1件で作成します。2問目以降は現在公開中のJSONを必ず選んでください。</p><h2>2. 新しい問題</h2><label>写真（JPEG / PNG / WebP / GIF）<input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label>問題ID（英数字・ハイフン・アンダースコア）<input id="id" placeholder="q001"></label><label>タイトル<input id="title" placeholder="公園にかくれんぼ"></label><label>難易度<select id="difficulty"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><label>正解範囲（画像の短辺に対する割合 %）<input id="radius" type="number" min="1" max="30" value="6"></label><div class="photo" id="editor"><img id="preview" alt="写真プレビュー" hidden><div id="marker" hidden></div></div><p id="coords">写真を選択してください</p><button id="download" disabled>更新済みJSONと写真をZIPで保存</button><p class="small">ZIPの中身をGitHubリポジトリの同じパスへアップロードします。既存の画像は消さないでください。問題IDは重複不可です。公開サイトの管理画面には認証がありませんが、GitHubへの書き込み権限もありません。</p></section></main><footer>Find Me — 管理画面</footer><script src="js/admin.js"></script></body></html>
