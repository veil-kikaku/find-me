<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="#ffe5a6" name="theme-color"/>
  <title>
   ベルプロかくれんぼ
  </title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <h1 class="site-title">
       <img src="images/logo.png" alt="">
       <span>ベルプロかくれんぼ</span>
   </h1>
   <p>
    写真に隠れてるキャラクターを探そう！
   </p>
  </header>
  <main>
   <nav class="page-nav">
    <button id="homeButton" type="button" hidden>キャラクター選択</button>
    <button id="back" type="button" hidden>問題一覧</button>
   </nav>
   <section id="home">
    <h2>キャラクターを選んでね！</h2>
    <div class="category-grid" id="categories"></div>
   </section>
   <section id="questionList" hidden>
    <h2 id="categoryTitle"></h2>
    <div class="cards" id="list"></div>
   </section>
   <section hidden="" id="play">
    <h2 id="title">
    </h2>
    <p id="info">
    </p>
    <p class="small">
     写真の中の隠れたものをタップしてね。ドラッグで移動、ホイール・ピンチで拡大できます。タップで回答！
    </p>
    <div class="zoom-controls">
     <button id="zoomIn" type="button">
      ＋
     </button>
     <span id="zoomLevel">
      100%
     </span>
     <button id="zoomOut" type="button">
      －
     </button>
     <button id="zoomReset" type="button">
      リセット
     </button>
    </div>
    <div class="photo" id="photo">
     <div id="photoLayer">
      <img alt="問題写真" draggable="false" id="photoimg"/>
      <div hidden="" id="answerMark">
      </div>
     </div>
    </div>
    <p aria-live="polite" id="message">
     写真をクリック・タップしてね
    </p>
    <button id="hint">
     ヒント
    </button>
    <button id="reveal">
     答えを見る
    </button>
   </section>
  </main>
  <footer>
   ベルプロかくれんぼ
  </footer>
  <script src="js/game.js">
  </script>
 </body>
</html>
